# Only for *writing* migrations (`alembic revision --autogenerate -m "..."`). Applying them
# goes through `tq migrate`, which needs no ini file. The database URL comes from
# TQ_DATABASE_URL — see AGENTS.md#migrations.
[alembic]
script_location = src/pgtaskqueue/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = src
# Left empty on purpose: env.py falls back to TQ_DATABASE_URL.
sqlalchemy.url =

# The archive's history: `alembic --name archive revision --autogenerate -m "..."`. The URL
# comes from TQ_ARCHIVE_DATABASE_URL.
[archive]
script_location = src/pgtaskqueue/migrations_archive
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = src
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
